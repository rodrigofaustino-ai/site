<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="t d"><title id="t">O que depende de quê</title><desc id="d">Cadastro salvo alimenta agenda e campos compatíveis dos formulários. Frequência diária alimenta as consultas dos totais. O formulário deve ser salvo antes de exportar uma cópia.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#27785c"/></marker></defs><rect width="1000" height="510" rx="16" fill="#f2f7f3"/><g font-family="Arial,sans-serif" fill="#244936"><text x="35" y="43" font-size="24" font-weight="bold">Preencher na origem → consultar → conferir → salvar no destino</text><g fill="white" stroke="#aac9b7" stroke-width="2"><rect x="35" y="87" width="265" height="110" rx="12"/><rect x="367" y="87" width="265" height="110" rx="12"/><rect x="700" y="87" width="265" height="110" rx="12"/><rect x="35" y="273" width="265" height="110" rx="12"/><rect x="367" y="273" width="265" height="110" rx="12"/><rect x="700" y="273" width="265" height="110" rx="12"/></g><g font-size="20" font-weight="bold"><text x="53" y="119">1. Cadastro salvo</text><text x="385" y="119">2. Agenda / Grade</text><text x="718" y="119">3. Frequência diária</text><text x="53" y="305">4. Formulário vinculado</text><text x="385" y="305">5. Salvar documento</text><text x="718" y="305">6. Exportar uma cópia</text></g><g font-size="16"><text x="53" y="149">Nome, escola, contatos,</text><text x="53" y="174">turno, dias e horários</text><text x="385" y="149">Mostram a programação.</text><text x="385" y="174">Não confirmam presença.</text><text x="718" y="149">Lançar P, F, FJ ou SAP</text><text x="718" y="174">e conferir a confirmação</text><text x="53" y="335">Completar dados vazios;</text><text x="53" y="360">consultar totais à parte</text><text x="385" y="335">Revisar campos e textos;</text><text x="385" y="360">usar Salvar do formulário</text><text x="718" y="335">Baixar e abrir o arquivo;</text><text x="718" y="360">conferir antes de imprimir</text></g><g fill="none" stroke="#27785c" stroke-width="3" marker-end="url(#arrow)"><path d="M305 140H357"/><path d="M637 140H690"/><path d="M167 203V263"/><path d="M832 203V235H167V263"/><path d="M305 330H357"/><path d="M637 330H690"/></g><text x="405" y="229" font-size="14">Totais: usar a consulta específica da ferramenta</text><text x="35" y="444" font-size="18" font-weight="bold">Consultar não salva. Exportar não atualiza a ficha.</text><text x="35" y="475" font-size="16">Cada tela explica a origem e o período da contagem. As cópias baixadas são independentes.</text></g></svg>
